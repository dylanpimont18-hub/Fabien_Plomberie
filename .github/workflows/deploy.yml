name: Déploiement GitHub Pages

# Construit le site Eleventy et publie le dossier _site sur la branche gh-pages.
# GitHub Pages sert cette branche (Settings → Pages → Source : Deploy from a branch → gh-pages / root).

on:
  push:
    branches: [main, master, claude/site-fremont-plomberie]
  workflow_dispatch:
    inputs:
      site_mode:
        description: "Mode du site (demo = bandeau + noindex, prod = indexable)"
        required: true
        default: "demo"
        type: choice
        options: [demo, prod]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        env:
          # demo par défaut ; passer en prod via "Run workflow" ou la variable de dépôt SITE_MODE
          SITE_MODE: ${{ github.event.inputs.site_mode || vars.SITE_MODE || 'demo' }}
          # Sans domaine personnalisé : https://<utilisateur>.github.io/<depot>/
          # Avec un domaine : définir les variables de dépôt SITE_URL (https://www.exemple.fr) et PATH_PREFIX (/)
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          PATH_PREFIX: ${{ vars.PATH_PREFIX || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Publier sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          cname: ${{ vars.CUSTOM_DOMAIN }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Déploiement ${{ github.sha }}"
